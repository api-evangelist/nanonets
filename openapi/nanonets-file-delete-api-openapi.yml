openapi: 3.2.0
info:
  title: Nanonets File Management File Delete API
  description: 'Approve, unapprove, assign, update fields on, delete, and re-export files

    within a Nanonets model. These endpoints drive the human-in-the-loop review

    workflow and downstream export retries.'
  version: 2.0.0
  contact:
    name: Nanonets
    url: https://nanonets.com
    email: support@nanonets.com
servers:
- url: https://app.nanonets.com
security:
- BasicAuth: []
tags:
- name: File Delete
  description: Delete a processed file.
paths:
  /api/v2/Inferences/Model/{model_id}/InferenceRequestFiles/{file_id}:
    delete:
      tags:
      - File Delete
      summary: Delete A File
      description: Permanently delete a processed file from a model.
      operationId: deleteFile
      parameters:
      - $ref: '#/components/parameters/ModelId'
      - name: file_id
        in: path
        required: true
        schema:
          type: string
      responses:
        '200':
          description: File deleted.
components:
  parameters:
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
