openapi: 3.2.0
info:
  title: Nanonets File Management File Assignment API
  description: 'Approve, unapprove, assign, update fields on, delete, and re-export files

    within a Nanonets model. These endpoints drive the human-in-the-loop review

    workflow and downstream export retries.'
  version: 2.0.0
  contact:
    name: Nanonets
    url: https://nanonets.com
    email: support@nanonets.com
servers:
- url: https://app.nanonets.com
security:
- BasicAuth: []
tags:
- name: File Assignment
  description: Assign files to reviewers.
paths:
  /api/v2/team/members/model/{model_id}/assign/files:
    post:
      tags:
      - File Assignment
      summary: Assign Files To A Team Member
      description: Assign one or more files in a model to a specific reviewer by email.
      operationId: assignFiles
      parameters:
      - $ref: '#/components/parameters/ModelId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - member
              - file_ids
              properties:
                member:
                  type: string
                  format: email
                file_ids:
                  type: array
                  items:
                    type: string
      responses:
        '200':
          description: Files assigned.
components:
  parameters:
    ModelId:
      name: model_id
      in: path
      required: true
      schema:
        type: string
  securitySchemes:
    BasicAuth:
      type: http
      scheme: basic
