    description: >-
      Synchronous and asynchronous OCR prediction and training endpoints over
      `app.nanonets.com/api/v2/OCR/Model/{model_id}`. Upload files by local path or public URL, retrieve predictions for
      a file, page, or batch, and train or retrain custom Nanonets OCR models. Sync endpoints are optimized for files of
      3 pages or fewer; async endpoints handle larger documents. Returns labels, bounding boxes, OCR text, confidence
      scores, and table cell predictions.
  - aid: nanonets:nanonets-image-classification-api
