      Conditions and database lookup actions inside the no-code workflow builder.
name: Nanonets
description: >-
  Nanonets is a no-code document AI and OCR platform that combines a custom-model OCR API, pre-built document models
  (invoices, receipts, purchase orders, bills of lading, passports, driver's licenses, bank statements), image
  classification, and a visual workflow builder with imports, transformations, lookups, approvals, and ERP/CRM/database
  exports. The Nanonets OCR-3 model and the open-source docext toolkit power the IDP Leaderboard number-one ranking.
  Enterprise tier adds SAML SSO, SCIM, role-based access, on-prem and private-cloud deployment, HIPAA, SOC 2 Type II,
  and ISO 27001.
