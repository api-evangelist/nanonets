        description: External database integrations for lookups and execute-query operations.
  - name: Solutions
    type: Solutions
    data:
      - name: Starter
        description: >-
          Free tier with $200 in credits, API access, email import, cloud storage connectors, up to 3 users, and
          community support.
      - name: Growth
        description: >-
          Volume-discount tier adding classification AI, barcode and signature detection, generative AI blocks, custom
          Python blocks, ERP and database integrations, AI reporting, and team-wide credit sharing.
      - name: Enterprise
        description: >-
          Tailored pricing with SAML SSO, SCIM, RBAC, HIPAA and SOC 2 compliance, private cloud or on-prem deployment,
          data residency, enterprise connectors (Salesforce, SAP, Oracle), dedicated support and SLAs, audit logs, SIEM
          integration, and whitelabel UI.
